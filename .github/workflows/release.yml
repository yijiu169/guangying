name: Build & Release

# 本仓库只保存「补丁 + 构建脚本」，构建时从上游拉 TVBox 源码再打补丁，
# 因此仓库体积很小，也不需要提交任何第三方二进制。
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      force:
        description: '标记为强制更新（客户端不可跳过）'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      KS_B64: ${{ secrets.KEYSTORE_BASE64 }}
      KS_PWD: ${{ secrets.KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      KEY_PWD: ${{ secrets.KEY_PASSWORD }}
    steps:
      - name: Checkout patch repo
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Fetch upstream TVBox
        run: |
          git clone --depth 1 https://github.com/q215613905/TVBoxOS.git src
          echo "upstream commit: $(git -C src rev-parse --short HEAD)"

      - name: Apply update + douban patch
        run: |
          # 防御：补丁仓库在 Windows 上打包时可能带 CRLF，Linux 上 bash 会直接语法报错
          find kit -type f \( -name '*.sh' -o -name '*.py' \) -exec sed -i 's/\r$//' {} +
          bash kit/scripts/apply-to-tvbox.sh src

      - name: Configure repo for self-update
        run: |
          printf 'gh.owner=%s\ngh.repo=%s\n' "${GITHUB_REPOSITORY_OWNER}" "${GITHUB_REPOSITORY#*/}" > src/local.properties
          cat src/local.properties

      - name: Gradle cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('src/**/*.gradle*', 'src/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: ${{ runner.os }}-gradle-

      - name: Compute version
        id: ver
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            VNAME="${GITHUB_REF_NAME#v}"
            TAG="${GITHUB_REF_NAME}"
          else
            VNAME="$(date -u +%Y.%m.%d.%H)"
            TAG="v${VNAME}"
          fi
          VCODE="$(date -u +%y%m%d%H)"
          echo "name=$VNAME" >> "$GITHUB_OUTPUT"
          echo "code=$VCODE" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "versionName=$VNAME versionCode=$VCODE tag=$TAG"

      - name: Keystore cache (无 Secrets 时用它保证多次构建签名一致)
        uses: actions/cache@v4
        with:
          path: .ci
          key: tvbox-ci-keystore-v1

      - name: Prepare keystore
        run: |
          mkdir -p .ci
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > .ci/release.keystore
            echo "使用仓库 Secrets 中的签名"
          else
            if [ ! -f .ci/release.keystore ]; then
              echo "未配置 Secrets，生成 CI 固定签名（缓存保证后续构建一致）"
              keytool -genkeypair -v -keystore .ci/release.keystore -alias tvbox \
                -keyalg RSA -keysize 2048 -validity 10000 \
                -storepass tvboxcipass -keypass tvboxcipass \
                -dname "CN=TVBox, OU=Dev, O=TVBox, L=CN, S=CN, C=CN"
            else
              echo "命中缓存，复用已有签名"
            fi
          fi
          cp .ci/release.keystore src/release.keystore
          ls -l src/release.keystore

      - name: Build release APK
        env:
          VERSION_CODE: ${{ steps.ver.outputs.code }}
          VERSION_NAME: ${{ steps.ver.outputs.name }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD || 'tvboxcipass' }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS || 'tvbox' }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD || 'tvboxcipass' }}
        working-directory: src
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleJavaRelease --no-daemon --stacktrace

      - name: Collect artifacts
        env:
          VCODE: ${{ steps.ver.outputs.code }}
          VNAME: ${{ steps.ver.outputs.name }}
          VTAG: ${{ steps.ver.outputs.tag }}
          VFORCE: ${{ github.event.inputs.force || 'false' }}
        run: |
          set -e
          APK=$(find src/app/build/outputs/apk -name "*.apk" | grep -i java | grep -vi python | head -1)
          if [ -z "$APK" ]; then APK=$(find src/app/build/outputs/apk -name "*.apk" | head -1); fi
          if [ -z "$APK" ]; then echo "找不到 APK，构建可能失败"; exit 1; fi
          echo "picked: $APK"
          cp "$APK" TVBox-latest.apk
          python3 -c "import json,os,hashlib,datetime;p='TVBox-latest.apk';d={'versionCode':int(os.environ['VCODE']),'versionName':os.environ['VNAME'],'tag':os.environ['VTAG'],'notes':'TVBox '+os.environ['VNAME'],'apk':'TVBox-latest.apk','size':os.path.getsize(p),'sha256':hashlib.sha256(open(p,'rb').read()).hexdigest(),'force':os.environ.get('VFORCE','false').lower()=='true','publishedAt':datetime.datetime.utcnow().strftime('%Y-%m-%dT%H:%M:%SZ')};json.dump(d,open('version.json','w'),ensure_ascii=False,indent=2)"
          cat version.json
          ls -lh TVBox-latest.apk version.json

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: TVBox ${{ steps.ver.outputs.name }}
          draft: false
          prerelease: false
          files: |
            TVBox-latest.apk
            version.json
          body: |
            ## TVBox ${{ steps.ver.outputs.name }}

            - versionCode: `${{ steps.ver.outputs.code }}`
            - 上游: `q215613905/TVBoxOS`

            客户端启动时读取本 Release 的 `version.json` 自动升级（直连不通自动走镜像）。
